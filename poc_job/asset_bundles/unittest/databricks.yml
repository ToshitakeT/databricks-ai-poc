bundle:
  name: poc_unittest_bundle

sync:
  paths:
    - .
    - ../../driver
    - ../../component

resources:
  jobs:
    POC_UnitTest:
      name: POC_UnitTest
      tasks:
        - task_key: run_all_tests
          notebook_task:
            notebook_path: ../../driver/run_all_tests.py
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED

targets:
  dev:
    default: true
    mode: development
    presets:
      name_prefix: ""